# Formatting, lints and tests for every push to main and every pull request.
#
# agg-rust has no path dependencies, so a plain checkout is enough. There is no
# rust-toolchain.toml, so these jobs use the current stable toolchain: a new
# stable's lints can fail the lint job, and are fixed when they appear.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # clippy covers every workspace target: the library, its tests, the wasm
  # demo crate (built natively here) and tools/pixel-compare.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Test
        run: cargo test --workspace
