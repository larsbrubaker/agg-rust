# Formatting, lints and tests for every push to main and every pull request.
#
# agg-rust has no path dependencies, so a plain checkout is enough. Every job
# runs on the toolchain pinned in rust-toolchain.toml, so CI lints with the
# same clippy and rustfmt as local checks and a newer stable's lints never
# fail CI unannounced.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # clippy covers every workspace target: the library, its tests, the wasm
  # demo crate (built natively here) and tools/pixel-compare.
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version, clippy, rustfmt and the wasm32
      # target; with no argument rustup installs exactly that.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version, clippy, rustfmt and the wasm32
      # target; with no argument rustup installs exactly that.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Test
        run: cargo test --workspace
